function init3d(){scene=new THREE.Scene();scene.background=new THREE.Color('#a7c7c7');scene.fog=new THREE.Fog('#a7c7c7',34,180);camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,300);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;gameEl.appendChild(renderer.domElement);clock=new THREE.Clock();scene.add(new THREE.HemisphereLight('#e7f2e7','#647064',2));const sun=new THREE.DirectionalLight('#fff0c8',3);sun.position.set(-35,55,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-80;sun.shadow.camera.right=80;sun.shadow.camera.top=80;sun.shadow.camera.bottom=-80;scene.add(sun);buildWorld();player=new THREE.Group();const body=box(.55,.95,.32,'#d7c09a');body.position.y=.95;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.21,16,12),mat('#d9aa83'));head.position.y=1.62;player.add(head);const shirt=box(.58,.54,.35,'#52756a');shirt.position.y=1.03;player.add(shirt);scene.add(player);player.position.set(0,0,2);camera.position.set(0,3.8,12);window.addEventListener('resize',resize);renderer.setAnimationLoop(frame)}
function mat(color,roughness=.85){return new THREE.MeshStandardMaterial({color,roughness})}function box(w,h,d,c,rough=.85){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c,rough));m.castShadow=true;m.receiveShadow=true;return m}
function ground(w,d,c,x,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.12,d),mat(c));m.position.set(x,-.1,z);m.receiveShadow=true;scene.add(m);return m}
function building(x,z,w,d,h,color,roof='#4a4b41'){const g=new THREE.Group();const base=box(w,h,d,color);base.position.y=h/2;g.add(base);const r=box(w+ .3,.22,d+.3,roof);r.position.y=h+.1;g.add(r);const door=box(.85,1.8,.07,'#554637');door.position.set(-w*.16,.9,d/2+.04);g.add(door);const winmat=new THREE.MeshStandardMaterial({color:'#a9d8d3',emissive:'#31595b',emissiveIntensity:.3});for(const wx of [-w*.31,w*.28]){const win=new THREE.Mesh(new THREE.BoxGeometry(.8,.65,.06),winmat);win.position.set(wx,h*.58,d/2+.05);g.add(win)}g.position.set(x,0,z);scene.add(g);return g}
function tree(x,z,s=1){const g=new THREE.Group(),tr=new THREE.Mesh(new THREE.CylinderGeometry(.13*s,.22*s,1.8*s,7),mat('#554333'));tr.position.y=.9*s;tr.castShadow=true;g.add(tr);for(let i=0;i<3;i++){const crown=new THREE.Mesh(new THREE.ConeGeometry((1.05-i*.13)*s,1.55*s,7),mat(['#365b43','#46684a','#57734e'][i]));crown.position.y=(1.9+i*.65)*s;crown.castShadow=true;g.add(crown)}g.position.set(x,0,z);scene.add(g)}
function makeCar(x,z,color='#b5c383',broken=false){const g=new THREE.Group();const chassis=box(3.2,.65,1.65,color);chassis.position.y=.83;g.add(chassis);const cabin=box(1.65,.78,1.36,'#7c958b');cabin.position.set(-.22,1.48,0);g.add(cabin);for(const side of [-1,1]){const glass=box(.84,.5,.035,'#b5d6d2');glass.position.set(-.22,1.5,side*.7);g.add(glass);for(const xx of [-1.05,1.08]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.24,16),mat('#232725'));w.rotation.x=Math.PI/2;w.position.set(xx,.48,side*.81);w.castShadow=true;g.add(w)}}const bumper=box(.18,.16,1.72,'#b7b7a4');bumper.position.set(1.64,.55,0);g.add(bumper);const lampmat=new THREE.MeshStandardMaterial({color:'#fff1ad',emissive:'#f8d988',emissiveIntensity:.4});for(let side of [-.5,.5]){const lamp=new THREE.Mesh(new THREE.BoxGeometry(.12,.22,.38),lampmat);lamp.position.set(1.61,.91,side);g.add(lamp)}if(broken){const mount=box(.05,.12,.8,'#454640');mount.position.set(-1.05,.51,.81);g.add(mount)}g.position.set(x,0,z);scene.add(g);return g}
function makeBike(x,z){const g=new THREE.Group();const frame=box(1.45,.16,.17,'#d18439');frame.position.y=.7;g.add(frame);for(const xx of [-.66,.66]){const w=new THREE.Mesh(new THREE.TorusGeometry(.35,.07,8,18),mat('#252927'));w.rotation.y=Math.PI/2;w.position.set(xx,.38,0);w.castShadow=true;g.add(w)}const tank=new THREE.Mesh(new THREE.SphereGeometry(.28,12,10),mat('#b64e37'));tank.scale.set(1,.7,.75);tank.position.set(-.08,.96,0);g.add(tank);const seat=box(.6,.12,.35,'#282a25');seat.position.set(-.48,1.03,0);g.add(seat);const fork=box(.09,.8,.1,'#bcb8a4');fork.position.set(.56,.72,0);fork.rotation.z=-.2;g.add(fork);g.position.set(x,0,z);scene.add(g);return g}
function buildWorld(){ground(250,250,'#748461',0,0);const road=ground(14,230,'#555951',0,-22);road.position.y=-.025;for(let z=-130;z<85;z+=12){const stripe=box(.18,.035,5.3,'#c7c5ad');stripe.position.set(0,-.015,z);scene.add(stripe)}ground(42,32,'#929078',0,8);const home=building(0,-1,12,10,4.2,'#b99c76','#634a3c');home.children[0].material.transparent=true;home.children[0].material.opacity=.14;home.children[0].material.depthWrite=false;home.children[1].visible=false;building(-22,-36,12,9,4.8,'#8e9b88','#43463d');building(26,-58,13,10,5.4,'#c4b799','#59544a');building(29,-91,12,10,4.2,'#a9a58b','#574c3c');building(0,21,8,7,3.6,'#948c75','#45473d');
// cabin interior dressing
const bed=box(2.4,.42,1.45,'#788d8a');bed.position.set(-3,.5,1.4);scene.add(bed);const pillow=box(.55,.18,.7,'#e1ddc8');pillow.position.set(-3.65,.8,1.4);scene.add(pillow);const blanket=box(1.5,.15,1.4,'#a75e4c');blanket.position.set(-2.75,.78,1.4);scene.add(blanket);const table=box(1.5,.15,.9,'#806447');table.position.set(3,.8,1.4);scene.add(table);for(const x of [2.4,3.6])for(const z of [1.05,1.75]){const leg=box(.1,.8,.1,'#584738');leg.position.set(x,.4,z);scene.add(leg)}const sink=box(.75,.35,.55,'#c3c4b5');sink.position.set(4,.6,-1.7);scene.add(sink);const shower=box(1.2,2,.1,'#adc6c0');shower.position.set(4.5,1,-3.2);scene.add(shower);const stove=box(.9,.85,.7,'#393c38');stove.position.set(-4,.42,-2.8);scene.add(stove);const fridge=box(.85,1.9,.8,'#d2d3c7');fridge.position.set(-5.3,.95,-2.5);scene.add(fridge);
// wreck, parts and shops
const playerCar=makeCar(10,8,'#796c54',true);playerCar.userData={kind:'car'};const bike=makeBike(3,8);bike.userData={kind:'bike'};const wreck=makeCar(-22,-47,'#777366',true);wreck.rotation.y=.18;
const target=(kind,x,z,label)=>{const o=new THREE.Object3D();o.position.set(x,0,z);o.userData={kind,label};scene.add(o);return o};
target('bed',-3,1.4,'Bed');target('shower',4.5,-3.2,'Shower');target('fridge',-5.3,-2.5,'Fridge');target('stove',-4,-2.8,'Stove');target('shop',-22,-30,'Auto parts shop');target('grocery',26,-51,'Grocery store');target('bathroom',4.5,-2,'Washroom');
playerCar.position.set(9,0,9);bike.position.set(4,0,9);
const part1=box(.5,.4,.42,'#80909a');part1.position.set(-20,.35,-41);part1.userData={kind:'battery',label:'Old battery'};scene.add(part1);const tire=new THREE.Mesh(new THREE.TorusGeometry(.45,.13,10,22),mat('#242725'));tire.rotation.x=Math.PI/2;tire.position.set(-25,.48,-45);tire.userData={kind:'wheel',label:'Spare tyre'};tire.castShadow=true;scene.add(tire);
const sign=(text,x,z,color)=>{const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='#18201ddd';ctx.fillRect(0,0,512,128);ctx.fillStyle=color;ctx.font='bold 34px sans-serif';ctx.fillText(text,24,80);const tex=new THREE.CanvasTexture(c);const m=new THREE.Mesh(new THREE.PlaneGeometry(5,1.25),new THREE.MeshBasicMaterial({map:tex,transparent:true}));m.position.set(x,5,z);scene.add(m)};sign('HOME',0,-6,'#d8f274');sign('AUTO PARTS',-22,-30,'#f1bd76');sign('GROCERY',26,-51,'#d8f274');sign('JUNKYARD',29,-84,'#e58d69');
// bushes scatter
for(let i=0;i<65;i++){const x=(Math.random()-.5)*140,z=(Math.random()-.5)*170;if(Math.abs(x)<9&&z<20&&z>-110)continue;const b=new THREE.Mesh(new THREE.IcosahedronGeometry(.55+Math.random()*.55,1),mat(Math.random()>.5?'#5c7950':'#71845a'));b.scale.y=.5;b.position.set(x,.28,z);b.castShadow=true;scene.add(b)}for(let i=0;i<50;i++){let x=(Math.random()-.5)*145,z=(Math.random()-.5)*175;if(Math.abs(x)<11)continue;tree(x,z,.7+Math.random()*.65)}
}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function start(load=false){if(load){const s=JSON.parse(localStorage.getItem('springSave')||'null');if(s)Object.assign(state,s)}else{Object.assign(state,{health:100,hunger:88,thirst:85,stress:24,clean:80,fatigue:18,money:80,day:1,parts:{battery:false,wheel:false},installed:false,inventory:{}})}$('#menu').style.display='none';$('#topbar').style.display='flex';$('#objective').style.display='block';$('#touch').style.display=innerWidth<=700?'flex':'none';started=true;player.position.set(0,0,2);updateHud();toast(load?'Welcome back. Your progress is saved.':'Day 1. Your car is waiting outside.');}
function updateHud(){state.respect=Math.round(state.clean*.82+state.health*.18);const labels=[['HEALTH','health'],['HUNGER','hunger'],['THIRST','thirst'],['STRESS','stress'],['CLEAN','clean'],['RESPECT','respect'],['FATIGUE','fatigue']];$('#stats').innerHTML=labels.map(([l,k])=>`<div class="stat"><div class="stat-head"><span>${l}</span><span class="stat-val">${Math.round(state[k])}%</span></div><div class="meter"><i style="width:${state[k]}%;${k==='stress'?'background:#e8a16c':''}"></i></div></div>`).join('');$('#money').textContent='€ '+state.money;let text=state.parts.battery&&state.parts.wheel?'Take the parts to your car and install them.':!state.parts.battery?'Find a battery at the old house.':'Find a spare tyre at the old house.';if(state.installed)text='Your car is ready — get in and take a drive!';$('#objectiveText').textContent=text;$('#saveLabel').textContent=localStorage.getItem('springSave')?'SAVED':'NO SAVE'}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2300)}
function setPanel(html){$('#card').innerHTML=html;$('#panel').style.display='flex';paused=true}function closePanel(){$('#panel').style.display='none';paused=false}
function interaction(){if(!near)return;const {kind}=near.userData;if(kind==='bed')setPanel(`<div class="eyebrow">HOME · REST</div><h2>Call it a day?</h2><p>Tidur memulihkan kesihatan dan fatigue. Your progress is saved when you sleep.</p><div class="card-actions"><button class="primary" id="sleep">Sleep & save</button><button id="cancel">Not yet</button></div>`);else if(kind==='shower')setPanel(`<div class="eyebrow">HOME · WASH</div><h2>Freshen up</h2><p>Take a shower to restore cleanliness and feel human again.</p><div class="card-actions"><button class="primary" id="wash">Take a shower</button><button id="cancel">Later</button></div>`);else if(kind==='fridge'||kind==='stove')setPanel(`<div class="eyebrow">HOME · KITCHEN</div><h2>Something to eat</h2><p>Use €8 for a hearty meal. Restores hunger and a little health.</p><div class="card-actions"><button class="primary" id="eat">Buy meal · €8</button><button id="cancel">Not now</button></div>`);else if(kind==='shop'||kind==='grocery')openShop(kind);else if(kind==='battery'||kind==='wheel')pickup(near);else if(kind==='car'){if(!state.parts.battery||!state.parts.wheel)setPanel(`<div class="eyebrow">YOUR DRIVEWAY</div><h2>Almost a car</h2><p>It needs a battery and a spare tyre before it can run. Visit the old house down the road, then bring the parts back here.</p><div class="card-actions"><button class="primary" id="cancel">Got it</button></div>`);else if(!state.installed){state.installed=true;state.parts.battery=false;state.parts.wheel=false;updateHud();toast('Battery fitted. Spare tyre mounted. She lives!');}else{vehicleMode='car';ride=near.object;toast('Driving · W/S to move, A/D to steer')}}else if(kind==='bike'){vehicleMode='bike';ride=near.object;toast('Motorbike · W/S to move, A/D to steer')}else if(kind==='bathroom')toast('A tiny washroom, a very big day.');
$('#cancel')?.addEventListener('click',closePanel);$('#sleep')?.addEventListener('click',()=>{state.fatigue=8;state.health=clamp(state.health+20);state.hunger=clamp(state.hunger-12);state.thirst=clamp(state.thirst-10);state.day++;localStorage.setItem('springSave',JSON.stringify(state));updateHud();closePanel();toast(`Saved · Day ${state.day}. Good morning!`)});$('#wash')?.addEventListener('click',()=>{state.clean=100;state.stress=clamp(state.stress-12);updateHud();closePanel();toast('You feel much cleaner.')});$('#eat')?.addEventListener('click',()=>{if(state.money<8){toast('Not enough money.');return}state.money-=8;state.hunger=clamp(state.hunger+42);state.health=clamp(state.health+5);updateHud();closePanel();toast('Warm food hits the spot.')})}
function pickup(obj){const k=obj.userData.kind;if(state.parts[k]){toast('You already have one.');return}state.parts[k]=true;scene.remove(obj);updateHud();toast(`${obj.userData.label} collected · take it home!`)}
function openShop(kind){const grocery=kind==='grocery';setPanel(`<div class="eyebrow">${grocery?'VILLAGE SHOP':'AUTO PARTS · WORKSHOP'}</div><h2>${grocery?'Corner shop':'Parts counter'}</h2><p>${grocery?'A small shop for the essentials.':'The parts you need to bring your car back to life.'}</p>${grocery?`<div class="setting-row"><span>Water bottle · €4</span><button data-buy="water">BUY</button></div><div class="setting-row"><span>Snack · €6</span><button data-buy="food">BUY</button></div><div class="setting-row"><span>Cigarettes · €5</span><button data-buy="cigarette">BUY</button></div>`:`<div class="setting-row"><span>Car battery · €32</span><button data-buy="battery">BUY</button></div><div class="setting-row"><span>Spare tyre · €24</span><button data-buy="wheel">BUY</button></div><div class="setting-row"><span>Beer · €7</span><button data-buy="beer">BUY</button></div>`}<div class="card-actions"><button id="cancel">Leave shop</button></div>`);$('#card').querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy))}
function buy(item){const prices={water:4,food:6,cigarette:5,battery:32,wheel:24,beer:7},price=prices[item];if(state.money<price){toast('Not enough money.');return}if((item==='battery'||item==='wheel')&&state.parts[item]){toast('You already have that part.');return}state.money-=price;if(item==='water'){state.thirst=clamp(state.thirst+45)}if(item==='food'){state.hunger=clamp(state.hunger+38)}if(item==='cigarette'){state.stress=clamp(state.stress-20);state.clean=clamp(state.clean-8)}if(item==='beer'){state.stress=clamp(state.stress-25);state.thirst=clamp(state.thirst-8);state.health=clamp(state.health-2)}if(item==='battery'||item==='wheel')state.parts[item]=true;updateHud();toast('Bought. Keep your change.');openShop(item==='water'||item==='food'||item==='cigarette'?'grocery':'shop')}
function settings(){setPanel(`<div class="eyebrow">OPTIONS</div><h2>Settings</h2><p>Tune the game for your setup.</p><div class="setting-row"><span>Graphics</span><button id="quality">${state.quality}</button></div><div class="setting-row"><span>Control sensitivity</span><button id="sensitivity">${state.sensitivity.toFixed(1)}×</button></div><div class="setting-row"><span>Controls</span><span class="mono" style="font-size:10px;color:#d8f274">WASD · E · ESC</span></div><div class="card-actions"><button class="primary" id="cancel">Done</button></div>`);$('#quality').onclick=()=>{state.quality=state.quality==='High'?'Low':'High';renderer.setPixelRatio(state.quality==='High'?Math.min(devicePixelRatio,1.7):1);$('#quality').textContent=state.quality};$('#sensitivity').onclick=()=>{state.sensitivity=state.sensitivity>=1.5?.7:state.sensitivity+.2;$('#sensitivity').textContent=state.sensitivity.toFixed(1)+'×'};$('#cancel').onclick=closePanel}
function nearest(){let best=null,dist=2.8;scene.traverse(o=>{if(!o.userData.kind)return;const d=player.position.distanceTo(o.getWorldPosition(new THREE.Vector3()));if(d<dist){best=o;dist=d}});return best}
function frame(){const dt=Math.min(clock.getDelta(),.05);if(started&&!paused){state.hunger=clamp(state.hunger-dt*.045);state.thirst=clamp(state.thirst-dt*.065);state.fatigue=clamp(state.fatigue+dt*.025);if(state.hunger<8||state.thirst<8)state.health=clamp(state.health-dt*.35);if(Math.floor(clock.elapsedTime)%8===0&&Math.floor(clock.elapsedTime)!==frame.lastTick){frame.lastTick=Math.floor(clock.elapsedTime);updateHud()}
if(vehicleMode){const speed=vehicleMode==='bike'?13:10;const steer=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);ride.rotation.y+=steer*dt*1.6;const forward=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);ride.position.x+=Math.sin(ride.rotation.y)*forward*speed*dt;ride.position.z-=Math.cos(ride.rotation.y)*forward*speed*dt;if(ride.position.x>80||ride.position.x< -80||ride.position.z< -130||ride.position.z>60){ride.position.x=clamp(ride.position.x,-80,80);ride.position.z=clamp(ride.position.z,-130,60)}player.position.set(ride.position.x,0,ride.position.z);player.visible=false;}
else{const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),s=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);if(f||s){const ang=Math.atan2(s,f);player.rotation.y=ang;const speed=keys.shift?7.4:4.7;player.position.x+=Math.sin(ang)*speed*dt;player.position.z-=Math.cos(ang)*speed*dt;player.position.x=clamp(player.position.x,-90,90);player.position.z=clamp(player.position.z,-140,80)}player.visible=true;}
const focus=vehicleMode?ride:player;const behind=new THREE.Vector3(-Math.sin(focus.rotation.y)*8,4.2,Math.cos(focus.rotation.y)*8);const desired=focus.position.clone().add(behind);camera.position.lerp(desired,1-Math.pow(.002,dt));camera.lookAt(focus.position.x,1.1,focus.position.z);near=vehicleMode?null:nearest();if(near){$('#hint').style.display='block';$('#hintText').textContent=near.userData.label||({bed:'Sleep & save',shower:'Take a shower',fridge:'Make a meal',stove:'Make a meal',car:state.installed?'Drive car':'Inspect car',bike:'Ride motorbike',battery:'Pick up battery',wheel:'Pick up spare tyre',shop:'Browse car parts',grocery:'Visit grocery shop',bathroom:'Washroom'}[near.userData.kind]||'Interact')}else $('#hint').style.display='none';}
renderer.render(scene,camera)}
frame.lastTick=0;
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(k==='e'&&started&&!paused){if(vehicleMode){vehicleMode='';ride=null;player.visible=true;toast('Back on your feet.')}else interaction()}if(k==='escape'){if(paused)closePanel();else if(vehicleMode){vehicleMode='';ride=null;player.visible=true}else if(started)settings()}});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('.touch [data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>keys[k]=false))});$('#touchAct').addEventListener('click',()=>{if(vehicleMode){vehicleMode='';ride=null;player.visible=true}else interaction()});
init3d();if(localStorage.getItem('springSave'))$('#saveLabel').textContent='SAVED';
$('#newGame').onclick=()=>start(false);$('#continue').onclick=()=>{if(localStorage.getItem('springSave'))start(true);else toast('No save yet. Sleep in your bed to save.')};$('#settingsBtn').onclick=settings;
</script></body></html>
